[workspace]
resolver = "3"
members = ["crates/libpikmin", "crates/libpikmin-assets", "crates/libpikmin-ffi", "crates/viewer"]
default-members = ["crates/libpikmin", "crates/libpikmin-assets", "crates/libpikmin-ffi"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
libpikmin = { path = "crates/libpikmin" }
libpikmin-assets = { path = "crates/libpikmin-assets" }
glam = "0.30"
